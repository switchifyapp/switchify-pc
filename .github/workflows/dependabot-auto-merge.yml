name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for patch and minor bumps
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this PR may auto-merge
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
        run: |
          allowed=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) allowed=true ;;
          esac
          case "$DEPENDENCY_GROUP" in
            *-major) allowed=false ;;
          esac
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "Update type '${UPDATE_TYPE:-unknown}' in group '${DEPENDENCY_GROUP:-none}': auto-merge allowed=$allowed"

      - name: Enable squash auto-merge
        if: steps.decide.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
