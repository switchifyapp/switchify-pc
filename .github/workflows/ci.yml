name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject retired product identity
        run: |
          retired_identity="pre""view"
          if git grep -n -i "$retired_identity" -- ':!src-tauri/Cargo.lock'; then
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate release updater configuration
        shell: bash
        run: |
          npx tauri signer generate --ci --password validation-only --write-keys "$RUNNER_TEMP/updater.key"
          SWITCHIFY_UPDATER_PUBLIC_KEY="$(cat "$RUNNER_TEMP/updater.key.pub")" node scripts/render-updater-config.mjs "$RUNNER_TEMP/tauri.release.json"
          node -e 'const c=require(process.argv[1]); if (!c.bundle.createUpdaterArtifacts || c.plugins.updater.endpoints.length !== 1 || !c.plugins.updater.pubkey) process.exit(1)' "$RUNNER_TEMP/tauri.release.json"
          mkdir -p "$RUNNER_TEMP/artifacts/mac" "$RUNNER_TEMP/artifacts/windows"
          touch "$RUNNER_TEMP/artifacts/mac/Switchify.PC.app.tar.gz" "$RUNNER_TEMP/artifacts/windows/Switchify.PC_1.0.0_x64-setup.exe"
          printf 'mac-signature' > "$RUNNER_TEMP/artifacts/mac/Switchify.PC.app.tar.gz.sig"
          printf 'windows-signature' > "$RUNNER_TEMP/artifacts/windows/Switchify.PC_1.0.0_x64-setup.exe.sig"
          node scripts/create-update-feed.mjs "$RUNNER_TEMP/artifacts" 1.0.0-beta.1 v1.0.0-beta.1 "$RUNNER_TEMP/latest.json"
          node -e 'const f=require(process.argv[1]); if (f.platforms["darwin-aarch64"].signature !== "mac-signature" || f.platforms["windows-x86_64"].signature !== "windows-signature") process.exit(1)' "$RUNNER_TEMP/latest.json"
          if node scripts/create-update-feed.mjs "$RUNNER_TEMP/artifacts" 1.0.0-beta.1 v1.0.0-beta.2 "$RUNNER_TEMP/invalid.json"; then
            echo 'Mismatched update tag was accepted.' >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-14
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        run: cargo fmt --manifest-path src-tauri/startup-launcher/Cargo.toml --check
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --manifest-path src-tauri/startup-launcher/Cargo.toml --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/startup-launcher/Cargo.toml
      - if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --no-sign
      - if: runner.os == 'Windows'
        run: pwsh ./scripts/Build-WindowsUiAccess.ps1 -SkipSign
      - if: runner.os == 'Windows'
        run: |
          $env:SWITCHIFY_ALLOW_UNSIGNED_UIACCESS_PACKAGE = '1'
          pwsh ./scripts/Verify-WindowsUiAccessPackage.ps1
