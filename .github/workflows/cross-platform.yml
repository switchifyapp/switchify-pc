name: Cross-platform preview

on:
  pull_request:
    paths:
      - 'cross-platform/**'
      - '.github/workflows/cross-platform.yml'
  push:
    branches:
      - main
    paths:
      - 'cross-platform/**'
      - '.github/workflows/cross-platform.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-14
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
