version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
    labels:
      - dependencies
    commit-message:
      prefix: "Update npm dependencies"

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    groups:
      site-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      site-npm-major:
        patterns:
          - "*"
        update-types:
          - major
    labels:
      - dependencies
    commit-message:
      prefix: "Update site dependencies"

  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /src-tauri/startup-launcher
      - /tools/updater-signature-verifier
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      cargo-major:
        patterns:
          - "*"
        update-types:
          - major
    labels:
      - dependencies
    commit-message:
      prefix: "Update Rust dependencies"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
    labels:
      - dependencies
    commit-message:
      prefix: "Update GitHub Actions"
