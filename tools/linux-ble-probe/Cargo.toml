[package]
name = "switchify-linux-ble-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[features]
# For headless development hosts without libdbus headers. CI uses system D-Bus.
vendored-dbus = ["dbus/vendored"]

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
bluer = { version = "=0.17.4", features = ["bluetoothd"] }
dbus = "0.9"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
